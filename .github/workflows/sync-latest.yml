name: 同步稳定版清单

on:
  release:
    types: [published, edited, deleted, unpublished, released]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stable-release-manifest
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 更新 main 上的 latest.json
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import json
          import os
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          repository = 'MiraTeams/miraday-browser-releases'
          api = 'https://api.github.com/repos/' + repository
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'User-Agent': 'miraday-release-manifest',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def request(path, payload=None):
              data = json.dumps(payload).encode() if payload is not None else None
              method = 'PUT' if data is not None else 'GET'
              req = Request(api + path, data=data, method=method, headers=headers)
              if data is not None:
                  req.add_header('Content-Type', 'application/json')
              with urlopen(req, timeout=30) as response:
                  return json.load(response)

          try:
              latest = request('/releases/latest')
          except HTTPError as error:
              if error.code != 404:
                  raise
              latest = None

          release = None
          if latest is not None:
              if latest['draft'] or latest['prerelease']:
                  raise ValueError('Expected a published stable release')
              release = {key: latest[key] for key in ('tag_name', 'html_url', 'draft', 'prerelease')}
              release['assets'] = []
              page = 1
              while True:
                  assets = request(f"/releases/{int(latest['id'])}/assets?per_page=100&page={page}")
                  release['assets'].extend(
                      {key: asset[key] for key in ('name', 'size', 'state', 'browser_download_url')}
                      for asset in assets
                  )
                  if len(assets) < 100:
                      break
                  page += 1

          manifest = {'schema': 1, 'repository': repository, 'release': release}
          output = (json.dumps(manifest, ensure_ascii=False, indent=2) + '\n').encode()
          path = '/contents/latest.json'
          existing = request(path + '?ref=main')
          if base64.b64decode(existing['content']) == output:
              print('main/latest.json is current')
          else:
              result = request(path, {
                  'message': '同步最新稳定版清单',
                  'branch': 'main',
                  'sha': existing['sha'],
                  'content': base64.b64encode(output).decode(),
              })
              print('Updated main/latest.json in ' + result['commit']['sha'])
